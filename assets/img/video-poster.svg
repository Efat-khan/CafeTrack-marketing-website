<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Video poster placeholder"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0f14"/><stop offset=".55" stop-color="#2a0f1c"/><stop offset="1" stop-color="#1b0d22"/></linearGradient><radialGradient id="glow" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#ff2d55" stop-opacity=".30"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3a2029" stroke-width="1"/></pattern></defs><rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#g)"/><ellipse cx="640" cy="302" rx="430" ry="270" fill="url(#glow)"/><rect x="10" y="10" width="1260" height="700" rx="14" fill="none" stroke="#ff2d55" stroke-width="2" stroke-dasharray="14 12" opacity=".45"/><text x="640" y="524" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#fdf4f6">Video poster &#8212; placeholder</text><text x="640" y="570" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#d3c0c6">Record a 90-second walkthrough and replace this file with a 1280×720 poster frame.</text><text x="640" y="602" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#d3c0c6">Suggested run: floor board → Start session → End session with the bill → daily sheet.</text><text x="640" y="668" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#34d399">Set CONFIG.video.youtubeId or CONFIG.video.mp4 to switch the player on</text></svg>