<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Stations screenshot placeholder"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".18"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs><rect width="1440" height="900" fill="#111827"/><rect width="1440" height="900" fill="url(#g)"/><rect width="1440" height="900" fill="url(#fade)"/><rect x="8" y="8" width="1424" height="884" fill="none" rx="10" stroke="#6366f1" stroke-width="2" stroke-dasharray="12 10" opacity=".55"/><rect x="530" y="153" width="380" height="52" rx="26" fill="#6366f1" opacity=".16"/><text x="720" y="188" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#6366f1" letter-spacing="2">SCREENSHOT 3 &#183; PLACEHOLDER</text><text x="720" y="297" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" fill="#e5e7eb">Stations &#8212; the rate table</text><text x="720" y="385" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#94a3b8">The full table, so the BY CONTROLLERS column is readable end to end:</text><text x="720" y="426" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#94a3b8">1× / 2× / 3× / 4× rates per station, the MAX column, and the QR Preview link.</text><text x="720" y="467" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#94a3b8">Capture in Dark mode so it sits inside this site&#x27;s dark browser frame.</text><text x="720" y="508" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#94a3b8">Browser width: 1440px.</text><text x="720" y="872" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#10b981">Replace this file &#183; keep the same filename and the same 1440&#215;900 ratio</text></svg>